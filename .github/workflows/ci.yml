name: CI - Build & Test

# Aciklayici yorum: Her push/PR'da: restore -> build -> test (coverage). Kirmizi ise merge engellenir.
# Guvenlik taramalari ayri workflow'da (security.yml).
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# ASILAN JOB KORUMASI / KUYRUK: ayni ref icin eszamanli kosulari tekille.
# cancel-in-progress YALNIZ pull_request'te true - main'e ard arda push edilen
# commit'lerin birbirinin kosusunu iptal etmesi istenmiyor (her commit'in kendi
# sonucu olsun). PR'larda ise eski kosu bosuna slot tutmasin.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Integration testleri gercek SQL Server'a ihtiyac duyar. OrderEndpointTests bunu Testcontainers ile
    # kendi ayaga kaldirir (Docker ubuntu runner'da mevcut). InvoiceCancellationTests ise hazir bir sunucu
    # bekler - LocalDB yalniz Windows'ta oldugundan burada service container ile saglanir.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          # NOT: gercek bir sir DEGIL. Yalniz bu is icin ayaga kalkan, is bitince yok olan, sadece
          # runner'a acik ephemeral container'in parolasi. SQL Server karmasiklik kuralini karsilar.
          MSSQL_SA_PASSWORD: "Divisima_CI_Str0ng!Pass"
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      # Fatura iptali testleri bu degiskeni okur. VERILDIGI ICIN testler artik ATLANAMAZ:
      # baglanilamazsa test sinifi InvalidOperationException firlatir (sessiz "yesil" imkansiz).
      DIVISIMA_TEST_SQL: "Server=localhost,1433;Database=DivisimaCiTest;User Id=sa;Password=Divisima_CI_Str0ng!Pass;TrustServerCertificate=True;Encrypt=False;"

      # --- OrderEndpointTests icin uygulama config'i (WebApplicationFactory Program.cs'i ayaga kaldirir) ---
      # Program.cs BASLANGICTA fail-fast yapiyor: SecurityKey >= 32 bayt olmali. Depodaki
      # appsettings.json'da bu deger "CHANGE_ME" (9 bayt) ve appsettings.Development.json
      # gitignore'da oldugu icin CI'da YOK -> host kurulamiyordu. Env ile saglaniyor.
      #
      # CI-only test degeri, GERCEK SECRET DEGIL. Bilerek okunabilir ve dusuk entropili secildi:
      #  - Program.cs'in placeholder listesine (CHANGE_ME/placeholder/your-/xxxxx/TODO) takilmaz
      #  - rastgele gorunmedigi icin kendi gitleaks secret-scan'imizi tetiklemez
      TokenOptions__SecurityKey: "divisima-ci-test-key-do-not-use-outside-ci-tests"
      # Hangfire (Program.cs) DbContext'ten BAGIMSIZ olarak bu baglantiyi kullaniyor;
      # CustomWebApplicationFactory yalniz DbContextOptions'i degistirdigi icin Hangfire buraya gider.
      # DIKKAT: DIVISIMA_TEST_SQL'den FARKLI bir veritabani adi - InvoiceCancellationTests
      # kendi DB'sini EnsureDeleted/EnsureCreated ile silip yeniden kuruyor; ayni DB olsaydi
      # Hangfire baglantisi acikken DROP DATABASE denenir ve testler birbirini bozardi.
      # DIKKAT - Database=master BILINCLI TERCIH: Hangfire veritabani OLUSTURMAZ, var olani
      # kullanir. Onceki deger (DivisimaAppTest) hicbir sey tarafindan olusturulmuyordu ve
      # acilista "Cannot open database" ile host kurulamiyordu. Service container her job'da
      # SIFIRDAN dogup is bitince yok oldugu icin Hangfire'in master'a kendi semasini acmasi
      # zararsiz. DIVISIMA_TEST_SQL'deki DB'lerden (DivisimaCiTest/DivisimaSecTest) ayri
      # oldugu icin fatura testlerinin EnsureDeleted/EnsureCreated dongusuyle de cakismaz.
      ConnectionStrings__DivisimaDb: "Server=localhost,1433;Database=master;User Id=sa;Password=Divisima_CI_Str0ng!Pass;TrustServerCertificate=True;Encrypt=False;"

    steps:
      - uses: actions/checkout@v4

      - name: .NET 8 kurulumu
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Bagimliliklari geri yukle
        run: dotnet restore Divisima-Backend.sln

      - name: Derle (Release, uyarilar gorunur)
        run: dotnet build Divisima-Backend.sln --configuration Release --no-restore

      # Aciklayici yorum: SQL Server'in gercekten dinledigini ADIM OLARAK gorunur kil (bagimliliksiz TCP
      # kontrolu - sqlcmd kurulumuna/imaj ici yola guvenmez). Gercek kimlik dogrulama zaten testlerde yapilir.
      - name: SQL Server hazir mi (service container)
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/1433) 2>/dev/null; then
              echo "SQL Server localhost:1433 dinliyor (deneme $i)."
              exit 0
            fi
            sleep 2
          done
          echo "HATA: SQL Server 120 sn icinde ayaga kalkmadi."
          exit 1

      # Aciklayici yorum: GERCEK SQL gerektiren testler AYRI adimda ve -v normal ile kosar; boylece her
      # testin adi tek tek Actions log'una basilir. [Trait("Category","Sql")] tasiyan TUM siniflar buraya
      # dahil - yeni bir SQL sinifi eklenince workflow degismez, yalniz trait eklenir.
      # Atlanmis olsalardi baglanti hatasiyla bu adim KIRMIZI olurdu.
      - name: SQL gerektiren testler (ATLANMAMALI)
        run: >
          dotnet test Divisima.IntegrationTests/Divisima.IntegrationTests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "console;verbosity=detailed"
          --filter "Category=Sql"
          --blame-hang
          --blame-hang-timeout 8m
          --blame-hang-dump-type none

      # Aciklayici yorum: Cikti bir dosyaya da yazilir (tee) - asagidaki TESHIS adimi kirmizi durumda
      # bunu suzup Summary sayfasina koyar. set -o pipefail SART: tee olmadan dotnet test cikis kodu
      # maskelenir ve BASARISIZ test adimi YESIL gorunurdu.
      - name: Testler + coverage
        run: |
          set -o pipefail
          dotnet test Divisima-Backend.sln \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --blame-hang --blame-hang-timeout 8m --blame-hang-dump-type none \
            2>&1 | tee test-output.txt

      # Aciklayici yorum: TESHIS - kirmizi durumda hata ozetini run Summary sayfasina yazar.
      # Public repoda Summary anonim GORUNUR (log indirme yetki ister). Boylece her kirmizi
      # kendi sebebini soyler ve log erisimi olmadan da teshis edilebilir.
      - name: TESHIS - basarisiz test ozeti (Summary)
        if: failure()
        run: |
          F=test-output.txt
          {
            echo "## Testler + coverage - hata ozeti"
            echo ""
            if [ ! -f "$F" ]; then
              echo "Cikti dosyasi yok - adim testlere gelmeden dusmus olabilir."
            else
              echo "### Basarisiz testler / hatalar"
              echo '```'
              grep -aE "^[[:space:]]*(Failed|X) |error CS|error NU|Assert\.|Expected |Actual " "$F" | head -60 \
                || echo "(eslesen satir yok)"
              echo '```'
              echo ""
              echo "### Cikti kuyrugu (son 100 satir)"
              echo '```'
              tail -n 100 "$F"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # ANNOTATION KANALI: annotation'lar check-runs API'sinden ANONIM okunabilir (Summary
          # okunamiyor - kimlik dogrulamasi istiyor). Bu yuzden kirmizinin sebebi buraya da basilir.
          # DIKKAT - annotation'lar PUBLIC: yalnizca TEST SONUCU satirlari basilir; cikti kuyrugu
          # ve ortam bilgisi Summary'de kalir, buraya SIZDIRILMAZ.
          #
          # DESEN GENISLETILDI: onceki hali yalniz "Failed" ve "Expected/Actual" satirlarini
          # aliyordu. Hata bir ASSERTION degil ISTISNA oldugunda hicbir sebep satiri dusmuyordu -
          # OrderEndpointTests uc run boyunca "Failed <isim>" disinda tek kelime uretmedi.
          # Artik istisna tipi satirlari da yakalaniyor:
          #   "   System.InvalidOperationException : ..."      (dis istisna)
          #   "---- Microsoft.Data.SqlClient.SqlException : ..." (IC istisna - asil sebep)
          # Yigin izi satirlari ("   at Namespace.Method(...)") KASITLI olarak disarida:
          # bunlar sebep degil gurultu. awk ile bire bir tekrar eden satirlar elenir (uygulamanin
          # kendi Serilog cikti satirlari ayni istisnayi defalarca yazabiliyor).
          if [ -f "$F" ]; then
            grep -aE "^[[:space:]]*(Failed|X) |^[[:space:]]*(Expected|Actual) |^[[:space:]]*(-+ )?[A-Za-z][A-Za-z0-9_.]*Exception[ :(]" "$F" \
              | awk '!seen[$0]++' | head -20 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi

      - name: Coverage raporunu yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage
          retention-days: 14

  # Aciklayici yorum: Kod formati/analiz kontrolu (editorconfig'e uyum).
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # KAPI SERTLESTIRILDI (format dalgasi). Eskiden tek adim + continue-on-error: true idi;
      # adim uzun suredir DUSUYORDU (exit 2) ama job YESIL gorunuyordu ve tek sinyal
      # annotation'daki "Process completed with exit code 2." satiriydi. Kok neden bulundu ve
      # duzeltildi: .editorconfig "crlf" ilan ediyordu, deponun icerigi ise LF idi
      # (olculdu: 650 dosyanin yalniz ~20'sinde CR). Politika LF'e cekildi ve .gitattributes
      # ile checkout tarafinda da sabitlendi.
      #
      # KAPSAM NEDEN "whitespace" + "style", "analyzers" DEGIL (olculdu):
      #   dotnet format ... whitespace --verify-no-changes -> cikis kodu 0
      #   dotnet format ... style      --verify-no-changes -> cikis kodu 0
      #   dotnet format ... analyzers  --verify-no-changes -> cikis kodu 2
      # analyzers dalindaki 26 dosya CA1848 / CA1310 / CA5350 gibi OTOMATIK DUZELTICISI OLMAYAN
      # analiz uyarilari tasiyor; "dotnet format" onlari duzeltemiyor, yalniz "degisecek" diye
      # sayiyor. Bu dali kapiya koymak, gecmesi imkansiz bir kapi kurmak olurdu. O uyarilar
      # zaten "Derle (Release, uyarilar gorunur)" adiminda GORUNUYOR.
      - name: Bicimlendirme dogrulama - whitespace (ZORUNLU)
        run: dotnet format Divisima-Backend.sln whitespace --verify-no-changes --verbosity diagnostic
      - name: Bicimlendirme dogrulama - style (ZORUNLU)
        run: dotnet format Divisima-Backend.sln style --verify-no-changes --verbosity diagnostic
