name: Security CI

# Açıklayıcı yorum: Her push/PR'da güvenlik kontrolleri: bağımlılık açıkları, statik analiz (CodeQL),
# secret taraması, container taraması. Kırmızıysa merge engellenir.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'   # her Pazartesi 06:00 - yeni açıklar için düzenli tarama
  # ELLE TETIKLEME - SPRINT 8 SONRASI MINI DALGA.
  #
  # GEREKCESI OLCUMDUR, kolaylik degil: gitleaks/gitleaks-action@v2 kaynagi (src/gitleaks.js,
  # Scan) okundu ve tarama kapsami olaya gore DEGISIYOR:
  #   push (ayni dal)  -> --log-opts=-1                      = YALNIZ SON COMMIT
  #   pull_request     -> --log-opts=... base^..head         = PR araligi
  #   schedule / workflow_dispatch -> HICBIR --log-opts YOK  = TUM GIT GECMISI
  # Yani ".gitleaksignore gercekten tutuyor mu" sorusunu bir PUSH kosumu ASLA yanitlayamaz;
  # yalniz TUM GECMISI tarayan bir kosum yanitlar. Bu tetik olmadan tek kanit haftalik cron'du
  # ve bir duzeltmenin dogrulanmasi icin Pazartesi'yi beklemek gerekiyordu.
  # Diger job'lar (dependency-scan / codeql / tests) icin de elle kosum zararsiz - hepsi
  # salt-okur dogrulama.
  workflow_dispatch:

# ASILAN JOB KORUMASI / KUYRUK: ayni ref icin eszamanli kosulari tekille.
# cancel-in-progress YALNIZ pull_request'te true - main push'lari birbirini iptal etmesin.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  # 1) Bağımlılık açığı taraması (dotnet list --vulnerable)
  #
  # KAPI KAPSAMI (2026-08-19): Kapı yalnız ÜRETİME ÇIKAN projeleri kırar.
  # Amaç, kapının kalıcı kırmızıda kalıp sinyal değerini yitirmesini önlemek:
  # yeşil bir kapı, YENİ çıkan her zafiyeti anında görünür kılar.
  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Kapı mantığı `dotnet list` ÇIKTI METNİNE (İngilizce) grep atıyor.
      # Runner locale'i değişirse grep sessizce eşleşmez -> locale SABİTLENDİ.
      DOTNET_CLI_UI_LANGUAGE: en
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      # GF-4/K4 (Y5): kilitli graf dogrulamasi - bkz. ci.yml'daki ayni adim.
      - name: Restore (kilitli graf)
        run: dotnet restore Divisima-Backend.sln --locked-mode

      # Rapor: TÜM çözüm (test projesi dahil). Bilgi amaçlı - build'i KIRMAZ.
      - name: Açık bağımlılık taraması - RAPOR (tüm çözüm)
        run: |
          echo "== Doğrudan + geçişli açık paketler (tüm çözüm, raporlama) =="
          dotnet list Divisima-Backend.sln package --vulnerable --include-transitive 2>&1 | tee vuln-full.txt

      # Kapı: yalnız üretime çıkan projeler + açık istisna listesi.
      - name: Açık bağımlılık KAPISI (üretim projeleri)
        run: |
          # Üretim projeleri ÇÖZÜMDEN TÜRETİLİR - elle liste TUTULMAZ. Elle liste,
          # çözüme sonradan eklenen bir projenin kapıdan SESSİZCE muaf kalmasına
          # yol açardı (güvenlik kapılarını zamanla işlevsiz kılan klasik tuzak).
          # NOT: `dotnet sln list` yolları ters bölü + CRLF ile veriyor (sln Windows'ta
          # üretildi). Linux runner'da çalışması için ikisi de normalize ediliyor -
          # normalize edilmezse `dotnet list` hiçbir projeyi bulamazdı.
          ALL=$(dotnet sln Divisima-Backend.sln list | tr -d '\r' | tr '\134' '/' | grep -E '\.csproj$')
          PROD=$(echo "$ALL" | grep -viE '[^/]*tests[^/]*\.csproj$' || true)
          SKIPPED=$(echo "$ALL" | grep -iE '[^/]*tests[^/]*\.csproj$' || true)

          # SAVUNMA 2 (görünürlük): hangi projelerin tarandığı her run'da log'a yazılır.
          echo "== KAPI KAPSAMINDAKİ ÜRETİM PROJELERİ =="
          echo "$PROD"
          echo "== KAPSAM DIŞI (test projeleri - RAPOR adımında taranıyorlar) =="
          echo "${SKIPPED:-<yok>}"

          # SAVUNMA 1 (boş/eksik liste): türetme bozulursa (sln formatı değişir, komut
          # hata verir, grep tutmaz) liste boşalır ve kapı HİÇBİR ŞEY TARAMADAN yeşil
          # görünürdü. Bu sessiz başarısızlık en tehlikeli durum - güvenli taraf KIRMAK.
          COUNT=$(printf '%s\n' "$PROD" | grep -c . || true)
          echo "Türetilen üretim projesi sayısı: $COUNT"
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::Üretim proje listesi türetilemedi veya beklenenden az ($COUNT < 3). Çözüm yapısı değişmiş olabilir; kapı güvenli tarafta KIRIYOR."
            exit 1
          fi

          : > gate.txt
          echo "$PROD" | while read -r proj; do
            [ -n "$proj" ] || continue
            echo "---- $proj ----"
            dotnet list "$proj" package --vulnerable --include-transitive 2>&1 | tee -a gate.txt
          done

          # SAVUNMA 3 (tarama gerçekten koştu mu): her proje için `dotnet list` ya
          # "has the following vulnerable packages" ya da "has no vulnerable packages"
          # basar. Sayı tutmuyorsa bazı projeler taranamamış demektir; boş çıktıyı
          # "temiz" saymak yerine KIR.
          SCANNED=$(grep -cE "has the following vulnerable packages|has no vulnerable packages" gate.txt || true)
          echo "Tarama çıktısı üretilen proje sayısı: $SCANNED / $COUNT"
          if [ "$SCANNED" -lt "$COUNT" ]; then
            echo "::error::Bazı projeler taranamadı ($SCANNED < $COUNT). Kapı güvenli tarafta KIRIYOR."
            exit 1
          fi

          # ---------------------------------------------------------------
          # AÇIK İSTİSNA LİSTESİ (allow-list)
          #
          # GHSA-rvv3-g6hj-g44x  —  AutoMapper 12.0.1 (High)
          #   Eklendi      : 2026-08-19
          #   Gerekçe      : Tek düzeltme 12 -> 16 major sıçraması. AutoMapper v15+
          #                  ticari lisansa geçtiği için bu TEKNİK DEĞİL, TİCARİ karar.
          #                  12.0.2 / 13.0.1 / 14.0.0 denendi: üçü de derlenmiyor (2x CS
          #                  hatası) ve advisory'yi zaten kapatmıyor, çünkü
          #                  AutoMapper.Extensions.Microsoft.DependencyInjection 12.0.1
          #                  paketi AutoMapper 12.0.1'i transitive olarak pinliyor.
          #   AYRI İŞ      : major bump + lisans kararı. Çözülünce bu satır SİLİNMELİ
          #                  (ve kapı kendiliğinden bu advisory'yi de kırmaya başlar).
          #
          # İstisna BİLEREK advisory-id bazında dar tutuldu: paket adı veya severity
          # bazlı geniş bir muafiyet YOK. Böylece AutoMapper'da çıkacak YENİ bir
          # advisory bile kapıyı kırmızı yapar.
          # ---------------------------------------------------------------
          ALLOW_IDS="GHSA-rvv3-g6hj-g44x"
          printf '%s\n' $ALLOW_IDS > allow.txt

          grep -oE 'GHSA-[A-Za-z0-9-]+' gate.txt | sort -u > found.txt
          echo "== Üretim projelerinde bulunan advisory'ler =="
          cat found.txt || true
          echo "== Açık istisnalar =="
          cat allow.txt

          REMAINING=$(grep -vxF -f allow.txt found.txt || true)
          if [ -n "$REMAINING" ]; then
            echo "::error::İstisna listesinde OLMAYAN açık bağımlılık bulundu:"
            echo "$REMAINING"
            exit 1
          fi
          echo "KAPI GEÇTİ - kalan advisory'lerin tamamı açık istisna listesinde."

      # GF-4/DUR-3: "|| true" BILINCLI OLARAK KALIYOR ve maskeleme YAPMIYOR.
      # OLCULDU: "dotnet list package --deprecated" bulgu VARKEN de cikis kodu 0 dondurur
      # (ayni sey --vulnerable icin de gecerli). Yani bu adim "|| true" olmadan da bulgu
      # yuzunden ASLA kirilmazdi; kaldirmak, olmayan bir kapiyi VAR SANDIRIRDI. "|| true"
      # burada yalnizca komutun KENDISININ (ag/restore) hatasini yutar ve adimi bilgi
      # amacli tutar. GERCEK kapi yukaridaki "Açık bağımlılık kapısı" adimidir: o, cikis
      # koduna degil CIKTI METNINE + advisory-id allowlist'ine bakar ve exit 1 verir.
      - name: Kullanımdan kalkmış paket kontrolü (BILGI AMACLI - kapi DEGIL)
        run: dotnet list Divisima-Backend.sln package --deprecated 2>&1 | tee deprecated.txt || true

      # ══ GF-4/K6 - VENDOR BUTUNLUK KAPISI ══════════════════════════════════════════════
      # frontend/vendor/ altindaki ucuncu taraf dosyalar depoya ELLE kopyalanmistir; NuGet
      # ya da npm gibi bir cozumleyici onlari DOGRULAMAZ. Yani bugune kadar o dosyalarin
      # degismedigini kontrol eden HICBIR mekanizma yoktu - bu, dalganin kapattigi tedarik
      # zinciri bosluklarindan biri (ve frontend/'in CI'ya ILK girisi).
      #
      # IKINCI KOPYA YOK: beklenen ozet zaten frontend/vendor/README.txt manifestinde
      # yaziliydi; kapi onu OKUR, kendi kopyasini tutmaz. Boylece "iki yerde ayni sayi"
      # sinifindan bir kayma dogmaz.
      #
      # CAPA NOTU (olculdu): manifestte "SHA-256" dizgesi IKI kez geciyor - biri yapisal
      # kayit satiri, digeri GUNCELLEME baslikli DUZ YAZI cumlesi. Gevsek bir grep duz
      # yaziyi okur; bu yuzden capa "anahtar : DEGER" bicimine ve 64 hane HEX'e baglandi.
      #
      # AYIRT-ETME KANITI (yerelde kum havuzunda kosuldu, depoya dokunulmadan):
      #   degismemis -> 0 · icerik degisti -> 1 · manifestsiz dosya -> 1 · dosya silindi -> 1
      - name: Vendor butunluk kapisi (frontend/vendor sha256 <-> README manifesti)
        run: |
          set -o pipefail
          MANIFEST="frontend/vendor/README.txt"
          HATA=0
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::Vendor manifesti bulunamadi: $MANIFEST"
            exit 1
          fi
          KAYITLAR=$(awk '
            /^[[:space:]]*Dosya[[:space:]]*:[[:space:]]*[^[:space:]]+[[:space:]]*$/ {
              sub(/^[^:]*:[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); cur = $0; next
            }
            /^[[:space:]]*SHA-256[[:space:]]*:[[:space:]]*[0-9a-f]{64}[[:space:]]*$/ {
              sub(/^[^:]*:[[:space:]]*/, ""); gsub(/[[:space:]]/, ""); sha[cur] = $0; next
            }
            /^[[:space:]]*Boyut[[:space:]]*:[[:space:]]*[0-9]+[[:space:]]*bayt[[:space:]]*$/ {
              sub(/^[^:]*:[[:space:]]*/, ""); sub(/bayt.*$/, ""); gsub(/[[:space:]]/, ""); boyut[cur] = $0; next
            }
            END { for (d in sha) printf "%s\t%s\t%s\n", d, sha[d], (d in boyut ? boyut[d] : "?") }
          ' "$MANIFEST")
          if [ -z "$KAYITLAR" ]; then
            echo "::error::Manifest AYRISTIRILAMADI - hicbir 'Dosya/SHA-256' kaydi okunamadi."
            exit 1
          fi
          echo "Manifest kayitlari:"
          echo "$KAYITLAR" | while IFS=$'\t' read -r d s b; do echo "  $d  sha=${s:0:12}...  boyut=$b"; done
          for f in frontend/vendor/*; do
            ad=$(basename "$f")
            [ "$ad" = "README.txt" ] && continue
            bek_sha=$(echo "$KAYITLAR" | awk -F'\t' -v a="$ad" '$1 == a { print $2 }')
            bek_boyut=$(echo "$KAYITLAR" | awk -F'\t' -v a="$ad" '$1 == a { print $3 }')
            if [ -z "$bek_sha" ]; then
              echo "::error::Vendor dosyasi manifestte KAYITLI DEGIL: $ad (manifeste eklenmeden vendor'a dosya konmaz)"
              HATA=1
              continue
            fi
            ger_sha=$(sha256sum "$f" | awk '{print $1}')
            ger_boyut=$(wc -c < "$f" | tr -d ' ')
            if [ "$ger_sha" != "$bek_sha" ]; then
              echo "::error::Vendor ozeti UYUSMUYOR: $ad"
              echo "::error::  beklenen $bek_sha"
              echo "::error::  gercek   $ger_sha"
              HATA=1
            elif [ "$ger_boyut" != "$bek_boyut" ]; then
              echo "::error::Vendor boyutu UYUSMUYOR: $ad beklenen=$bek_boyut gercek=$ger_boyut"
              HATA=1
            else
              echo "OK  $ad  sha256 ve boyut manifestle BIREBIR ($ger_boyut bayt)"
            fi
          done
          while IFS=$'\t' read -r d s b; do
            if [ ! -f "frontend/vendor/$d" ]; then
              echo "::error::Manifestte kayitli ama DOSYASI YOK: $d"
              HATA=1
            fi
          done <<< "$KAYITLAR"
          if [ "$HATA" -ne 0 ]; then
            echo "Vendor butunluk kapisi KIRMIZI."
            exit 1
          fi
          echo "Vendor butunluk kapisi YESIL."

  # 2) Statik güvenlik analizi (CodeQL - SQL injection, XSS, hardcoded secret vb.)
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: csharp
          queries: security-extended
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build Divisima-Backend.sln --configuration Release
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  # 3) Secret taraması (koda sızmış API key/şifre)
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (secret taraması)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4) Testler (iş mantığı simülasyonu + entegrasyon)
  #
  # SQL SERVER (2026-08-19): ci.yml'daki build-and-test ile AYNI kurulum. Öncesinde
  # burada service container yoktu; DIVISIMA_TEST_SQL tanımsız olduğu için
  # InvoiceCancellationTests bu job'da SESSİZCE ATLANIYORDU (Linux'ta LocalDB yok).
  # Aynı testlerin iki workflow'da farklı koşullarda çalışması yanıltıcıydı.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      sqlserver:
        # GF-4/K5 (Y6): tag + digest pini - gerekce ve dort kopyanin listesi ci.yml'da.
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:0730f3689a6dcc33beaf8f466376ac056d7483a2272dcbd3bcc36d3a6df05437
        env:
          ACCEPT_EULA: "Y"
          # NOT: gerçek bir sır DEĞİL - yalnız bu iş için ayağa kalkan, iş bitince
          # yok olan, sadece runner'a açık ephemeral container'ın parolası.
          MSSQL_SA_PASSWORD: "Divisima_CI_Str0ng!Pass"
          MSSQL_PID: Developer
          # Gerekce ci.yml'daki ayni ayarin yaninda ayrintili yazili (collation hizalamasi).
          # Iki workflow AYNI kurulumu kullanir; biri degisip digeri kalirsa testler iki farkli
          # collation'da kosar ve fark SESSIZ olur - META-PIN bunu da yakalar.
          MSSQL_COLLATION: Turkish_CI_AS
        ports:
          - 1433:1433
        options: >-
          --health-cmd "bash -c 'exec 3<>/dev/tcp/localhost/1433'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

    env:
      # Tanımlı olduğu için testler ARTIK ATLANAMAZ: bağlanılamazsa test sınıfı
      # InvalidOperationException fırlatır (sessiz "yeşil" imkansız).
      DIVISIMA_TEST_SQL: "Server=localhost,1433;Database=DivisimaSecTest;User Id=sa;Password=Divisima_CI_Str0ng!Pass;TrustServerCertificate=True;Encrypt=False;"

      # --- OrderEndpointTests icin uygulama config'i (WebApplicationFactory Program.cs'i ayaga kaldirir) ---
      # Program.cs BASLANGICTA fail-fast yapiyor: SecurityKey >= 32 bayt olmali. Depodaki
      # appsettings.json'da bu deger "CHANGE_ME" (9 bayt) ve appsettings.Development.json
      # gitignore'da oldugu icin CI'da YOK -> host kurulamiyordu. Env ile saglaniyor.
      #
      # CI-only test degeri, GERCEK SECRET DEGIL. Bilerek okunabilir ve dusuk entropili secildi:
      #  - Program.cs'in placeholder listesine (CHANGE_ME/placeholder/your-/xxxxx/TODO) takilmaz
      #  - rastgele gorunmedigi icin kendi gitleaks secret-scan'imizi tetiklemez
      TokenOptions__SecurityKey: "divisima-ci-test-key-do-not-use-outside-ci-tests"
      # Hangfire (Program.cs) DbContext'ten BAGIMSIZ olarak bu baglantiyi kullaniyor;
      # CustomWebApplicationFactory yalniz DbContextOptions'i degistirdigi icin Hangfire buraya gider.
      # DIKKAT: DIVISIMA_TEST_SQL'den FARKLI bir veritabani adi - InvoiceCancellationTests
      # kendi DB'sini EnsureDeleted/EnsureCreated ile silip yeniden kuruyor; ayni DB olsaydi
      # Hangfire baglantisi acikken DROP DATABASE denenir ve testler birbirini bozardi.
      # DIKKAT - Database=master BILINCLI TERCIH: Hangfire veritabani OLUSTURMAZ, var olani
      # kullanir. Onceki deger (DivisimaAppTest) hicbir sey tarafindan olusturulmuyordu ve
      # acilista "Cannot open database" ile host kurulamiyordu. Service container her job'da
      # SIFIRDAN dogup is bitince yok oldugu icin Hangfire'in master'a kendi semasini acmasi
      # zararsiz. DIVISIMA_TEST_SQL'deki DB'lerden (DivisimaCiTest/DivisimaSecTest) ayri
      # oldugu icin fatura testlerinin EnsureDeleted/EnsureCreated dongusuyle de cakismaz.
      ConnectionStrings__DivisimaDb: "Server=localhost,1433;Database=master;User Id=sa;Password=Divisima_CI_Str0ng!Pass;TrustServerCertificate=True;Encrypt=False;"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: İş mantığı güvenlik simülasyonu
        run: python3 tests/business_logic_sim.py
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: SQL Server hazır mı (service container)
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/localhost/1433) 2>/dev/null; then
              echo "SQL Server localhost:1433 dinliyor (deneme $i)."
              exit 0
            fi
            sleep 2
          done
          echo "HATA: SQL Server 120 sn içinde ayağa kalkmadı."
          exit 1

      # ASILMA KORUMASI: 8 dk hareketsiz kalan test host sonlandirilir, ASILAN TESTIN ADI log'a
      # basilir ve adim KIRMIZI duser. dump-type none - dosya uretmeden sonlandirir.
      # Cikti ayrica dosyaya yazilir (tee); asagidaki TESHIS adimi kirmizida bunu Summary'ye koyar.
      # set -o pipefail SART: yoksa tee, dotnet test cikis kodunu maskeler ve kirmizi adim YESIL gorunur.
      - name: Entegrasyon testleri
        run: |
          set -o pipefail
          dotnet test Divisima.IntegrationTests/Divisima.IntegrationTests.csproj \
            --configuration Release \
            --blame-hang --blame-hang-timeout 8m --blame-hang-dump-type none \
            2>&1 | tee test-output.txt

      # === RETRY GORUNURLUGU (D3 karari) - gerekcesi ci.yml'daki ikiziyle AYNI ======
      # `model` kilidi yeniden denemesi (SqlException 1807) YESIL bir kosumda hicbir anonim
      # kanaldan okunamiyor (job/run log uclari HTTP 403; TESHIS yalniz `if: failure()`).
      # Annotation ANONIM okunabildigi icin ozet oraya basilir. ADIM JOB'I KIRMAZ.
      - name: TestDbKurulum - 1807 yeniden deneme ozeti (annotation)
        if: always()
        run: |
          F=test-output.txt
          if [ ! -f "$F" ]; then
            echo "::warning::TestDbKurulum: cikti dosyasi yok - 1807 yeniden deneme sayisi OLCULEMEDI"
            exit 0
          fi
          N=$(grep -ac "\[TestDbKurulum\] 1807" "$F" || true)
          N=${N:-0}
          if [ "$N" -gt 0 ]; then
            echo "::warning::TestDbKurulum: 'model' kilidi yeniden denemesi (SQL 1807) $N kez ATESLEDI - retry GEREKTI ve kurtardi."
          else
            echo "::warning::TestDbKurulum: 1807 yeniden denemesi bu kosumda HIC ATESLEMEDI (0) - retry devrede, gerekmedi."
          fi
          exit 0

      # Aciklayici yorum: TESHIS - kirmizi durumda hata ozetini run Summary sayfasina yazar.
      # Public repoda Summary anonim GORUNUR (log indirme yetki ister).
      - name: TESHIS - basarisiz test ozeti (Summary)
        if: failure()
        run: |
          F=test-output.txt
          {
            echo "## Entegrasyon testleri - hata ozeti"
            echo ""
            if [ ! -f "$F" ]; then
              echo "Cikti dosyasi yok - adim testlere gelmeden dusmus olabilir."
            else
              echo "### Basarisiz testler / hatalar"
              echo '```'
              grep -aE "^[[:space:]]*(Failed|X) |error CS|error NU|Assert\.|Expected |Actual " "$F" | head -60 \
                || echo "(eslesen satir yok)"
              echo '```'
              echo ""
              echo "### Cikti kuyrugu (son 100 satir)"
              echo '```'
              tail -n 100 "$F"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # ANNOTATION KANALI: annotation'lar check-runs API'sinden ANONIM okunabilir (Summary
          # okunamiyor - kimlik dogrulamasi istiyor). Bu yuzden kirmizinin sebebi buraya da basilir.
          # DIKKAT - annotation'lar PUBLIC: YALNIZ Failed/assert satirlari basilir; cikti kuyrugu
          # ve ortam bilgisi Summary'de kalir, buraya SIZDIRILMAZ.
          # DESEN GENISLETILDI (ci.yml ile ayni): istisna tipi ve IC istisna satirlari da dusuyor,
          # yigin izi disarida, bire bir tekrarlar awk ile eleniyor. Gerekce icin ci.yml'daki
          # ayrintili yoruma bakin.
          if [ -f "$F" ]; then
            grep -aE "^[[:space:]]*(Failed|X) |^[[:space:]]*(Expected|Actual) |^[[:space:]]*(-+ )?[A-Za-z][A-Za-z0-9_.]*Exception[ :(]" "$F" \
              | awk '!seen[$0]++' | head -20 \
              | while IFS= read -r line; do echo "::error::${line}"; done
          fi
