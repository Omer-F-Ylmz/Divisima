name: Secret Rotation (Scheduled)

# Açıklayıcı yorum: 90 günde bir JWT + encryption key rotasyonu (Key Vault). Manuel de tetiklenebilir.
# Güvenlik: uzun ömürlü secret sızsa bile pencere sınırlı kalır.
on:
  schedule:
    - cron: '0 3 1 */3 *'   # her 3 ayda bir, ayın 1'i saat 03:00
  workflow_dispatch:          # manuel tetikleme

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    environment: production   # onay gerektiren ortam (koruma)
    steps:
      - uses: actions/checkout@v7
      - name: Azure login (OIDC - secret'sız)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Rotate secrets
        run: |
          chmod +x ops/rotate-secrets.sh
          ./ops/rotate-secrets.sh "${{ vars.KEY_VAULT_NAME }}"
      - name: Restart app (yeni secret'lar yüklensin)
        run: echo "Uygulamayı yeniden başlat (App Service/AKS - deployment pipeline'ına bağla)"
