name: Secret Rotation (Scheduled)

# ══ LF-1 / K5 - ZAMANLAMA KALDIRILDI (OLCULMUS GEREKCE) ═══════════════════════════════════
#
# Bu is akisi 90 gunluk bir cron ile JWT + encryption anahtarini Key Vault'ta dondururdu.
# LF-1'de OLCULDU: **uygulamada KASA OKUYUCUSU YOKTUR.**
#   - `Program.cs` KOSULSUZ `ConfigurationSecretProvider` kaydeder,
#   - `AzureKeyVaultSecretProvider` HICBIR YERDE kayitli DEGILDIR,
#   - `ISecretProvider`in URETIMDE tuketicisi **0**'dir.
# Yani kasada donen bir anahtar uygulamaya ULASMAZ. Zamanlanmis rotasyon bu haliyle
# guvenlik SAGLAMAZ ama ZARAR VEREBILIR: uretim ortamina bagli bir is akisi, kimsenin
# okumadigi bir degeri sessizce degistirir ve "anahtarlarim donuyor" YANILGISI uretir.
#
# KARAR (merkez): cron KALDIRILDI, is akisi YALNIZ ELLE tetiklenir. Ozelligin kaderi -
# okuyucuyu baglamak ya da iskeleti silmek - GF-7'ye devredildi. `SECURITY.md`in secret
# maddesi de ayni turda DURUSTLESTIRILDI.
on:
  workflow_dispatch:          # YALNIZ manuel tetikleme (cron LF-1/K5'te kaldirildi)

permissions:
  contents: read

jobs:
  rotate:
    runs-on: ubuntu-latest
    # GF-4 KAPANIS: CLAUDE.md 7 "her job'da timeout-minutes" sarti bu dosyada EKSIKTI.
    # Bu job onay bekleyen bir ortama baglidir; asili kalmasi Key Vault rotasyonunu
    # belirsiz sureli acik birakir.
    timeout-minutes: 15
    environment: production   # onay gerektiren ortam (koruma)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Azure login (OIDC - secret'sız)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Rotate secrets
        run: |
          chmod +x ops/rotate-secrets.sh
          ./ops/rotate-secrets.sh "${{ vars.KEY_VAULT_NAME }}"
      - name: Restart app (yeni secret'lar yüklensin)
        run: echo "Uygulamayı yeniden başlat (App Service/AKS - deployment pipeline'ına bağla)"
