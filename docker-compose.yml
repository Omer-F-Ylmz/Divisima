# Divisima - yerel gelistirme ortami. Tek komutla ayaga kalkar:  docker compose up
# Yeni gelistirici 5 dakikada calistirir (SQL Server + Redis + API).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Your_strong_Pass123}"
      MSSQL_PID: Developer
    ports:
      # GUVENLIK: yalniz localhost - zayif-default-sifreli DB agdaki diger makinelere ACILMASIN (host araci hala baglanabilir).
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # GUVENLIK: yalniz localhost - auth'suz Redis agdaki diger makinelere ACILMASIN (unauth-access engeli).
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DivisimaDb: "Server=sqlserver;Database=Divisima;User Id=sa;Password=${DB_PASSWORD:-Your_strong_Pass123};TrustServerCertificate=True"
      Redis__Enabled: "true"
      # DUZELTME: anahtar adi "Redis__Configuration" idi; Program.cs ise Redis:Connection okuyor.
      # Uyusmadigi icin Enabled=true olmasina ragmen baglanti dizgesi varsayilan localhost:6379'a
      # dusuyordu - yani api konteynerinin KENDI ici - ve ConnectionMultiplexer.Connect acilista
      # patliyordu. Konteyner hic ayaga kalkmiyordu.
      Redis__Connection: "redis:6379"
      # DUZELTME: bu degisken YOKTU. appsettings.json'daki TokenOptions:SecurityKey degeri
      # "CHANGE_ME" (9 bayt) ve Program.cs'in fail-fast blogu >= 32 bayt sarti KOSULSUZ - yani
      # Development'ta bile. Sonuc: "docker compose up" acilista InvalidOperationException ile
      # duser du. Asagidaki deger YALNIZ yerel gelistirme icindir, gercek secret DEGILDIR.
      TokenOptions__SecurityKey: "divisima-local-compose-key-do-not-use-in-production"
    ports:
      - "5000:5000"

volumes:
  mssql_data:
  redis_data:
