# Divisima - yerel gelistirme ortami. Tek komutla ayaga kalkar:  docker compose up
# Yeni gelistirici 5 dakikada calistirir (SQL Server + Redis + API).
services:
  sqlserver:
    # GF-4/K5 (Y6): tag + digest pini - gerekce ve dort kopyanin listesi ci.yml'da.
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-Your_strong_Pass123}"
      MSSQL_PID: Developer
    ports:
      # GUVENLIK: yalniz localhost - zayif-default-sifreli DB agdaki diger makinelere ACILMASIN (host araci hala baglanabilir).
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # GUVENLIK: yalniz localhost - auth'suz Redis agdaki diger makinelere ACILMASIN (unauth-access engeli).
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DivisimaDb: "Server=sqlserver;Database=Divisima;User Id=sa;Password=${DB_PASSWORD:-Your_strong_Pass123};TrustServerCertificate=True"
      Redis__Enabled: "true"
      # DUZELTME: anahtar adi "Redis__Configuration" idi; Program.cs ise Redis:Connection okuyor.
      # Uyusmadigi icin Enabled=true olmasina ragmen baglanti dizgesi varsayilan localhost:6379'a
      # dusuyordu - yani api konteynerinin KENDI ici - ve ConnectionMultiplexer.Connect acilista
      # patliyordu. Konteyner hic ayaga kalkmiyordu.
      Redis__Connection: "redis:6379"
      # DUZELTME: bu degisken YOKTU. appsettings.json'daki TokenOptions:SecurityKey degeri
      # "CHANGE_ME" (9 bayt) ve Program.cs'in fail-fast blogu >= 32 bayt sarti KOSULSUZ - yani
      # Development'ta bile. Sonuc: "docker compose up" acilista InvalidOperationException ile
      # duser du. Asagidaki deger YALNIZ yerel gelistirme icindir, gercek secret DEGILDIR.
      TokenOptions__SecurityKey: "divisima-local-compose-key-do-not-use-in-production"
    ports:
      - "5000:5000"
    volumes:
      # ══ DALGA C / C2 - YUKLENEN GORSELLER KALICI ══════════════════════════════════════════
      # OLCULEN ONCE-DURUM: compose'da mssql_data ve redis_data vardi, YUKLEMELER icin volume
      # YOKTU. LocalImageStorage dosyalari WebRootPath/uploads/products altina yazar (Sprint 8
      # madde 4), yani konteynerin YAZILABILIR KATMANINA - konteyner degistirildiginde (yeni
      # surum, yeniden olusturma) admin'in yukledigi TUM urun gorselleri KAYBOLUR ve
      # product_images tablosu var olmayan dosyalara isaret eder (vitrinde kalici 404).
      #
      # NON-ROOT YAZILABILIRLIGI OLCULDU (varsayilmadi): imajda `chown -R divisima:divisima
      # /app` COPY'den SONRA kosuyor ve `dotnet publish` wwwroot'u ciktiya kopyaliyor
      # (olculdu: 77 dosya), yani /app/wwwroot/uploads IMAJDA VAR ve divisima:divisima sahipli.
      # Docker adlandirilmis volume'u ilk mount'ta imaj icerigiyle VE SAHIPLIGIYLE baslatir ->
      # USER divisima yazabilir. (Bos bir host bind-mount kullanilsaydi root:root olur ve
      # yuklemeler sessizce basarisiz olurdu - bu yuzden ADLANDIRILMIS volume secildi.)
      - uploads_data:/app/wwwroot/uploads

  # ══ DALGA C / C1 - STOREFRONT'U SUNAN SERVIS ══════════════════════════════════════════════
  # Bu servis YOKTU: frontend'i kimin sunacagi depoda tanimsizdi (Dockerfile yalniz API'yi
  # publish ediyor, nginx.conf'ta yalniz api.divisima.com blogu vardi).
  # IKI ORIGIN korunuyor (kullanici karari): API :5000, storefront :5173 - yerelde bugune
  # kadar elle kurulan duzenin ta kendisi, artik `docker compose up` ile geliyor.
  # Uretimde karsiligi ops/infra/nginx.conf'taki divisima.com blogudur.
  frontend:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "5173:80"
    volumes:
      # SALT-OKUR: konteyner vitrin dosyalarini DEGISTIREMEZ. Origin yazimi bir DAGITIM
      # adimidir (ops/set-api-origin.sh), calisma ani isi degil.
      - ./frontend:/usr/share/nginx/html:ro
      - ./ops/infra/frontend-dev.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mssql_data:
  redis_data:
  uploads_data:
