# ══ GUVENLIK-FIX-3 / #4 - STOREFRONT GUVENLIK BASLIKLARI (TEK KAYNAK) ═══════════════════════
#
# NEDEN AYRI DOSYA: nginx'te `add_header` bir onceki seviyeden YALNIZCA o seviyede HIC
# `add_header` YOKSA devralinir. divisima.com blogunda kendi `add_header`ini tanimlayan IKI
# location var (`= /admin.html` ve `~* \.(html|js|json)$`) - yani sunucu seviyesindeki
# basliklar tam da ONEM TASIYAN sayfalara (index.html, admin.html, tum JS) ULASMIYOR.
# Basliklari uc yere ELLE kopyalamak, bu deponun bir kez bedelini odedigi "elle senkron"
# tuzagidir (DALGA-4-FIX-2 / M1). Bu yuzden TEK dosya, uc yerden `include` edilir.
#
# FAIL-SAFE: devralma yine de calisiyor olsa bile bu include YALNIZCA gereksiz olur, ZARARSIZ.
# Calismiyorsa (belgelenen davranis budur) ZORUNLUDUR. Iki okumada da dogru taraftadir.
#
# CSP YALNIZ `frame-ancestors` TASIR - BILINCLI:
#   - `frame-ancestors` bir <meta> CSP'sinde SPEC GEREGI YOK SAYILIR; clickjacking korumasi
#     ancak HTTP basligindan gelebilir (GUVENLIK DALGASI 2 / #4'te olculdu).
#   - Diger direktifler (script-src/connect-src/img-src/form-action) storefront'un META
#     etiketinde durur ve `ops/set-api-origin.sh` ONLARI yazar. Buraya bir kopya koymak,
#     betigin bilmedigi IKINCI bir senkron noktasi acardi - M1'in ta kendisi.
#   - Iki politika (meta + baslik) BAGIMSIZ ve KESISIMLI uygulanir; yalniz framing kisitlayan
#     bir baslik meta'daki script politikasini gevsetmez.
#
# API BLOGUNA EKLENMEDI - OLCULDU: `SecurityHeadersMiddleware` (Program.cs:540) her API
# yanitina zaten `frame-ancestors 'none'` iceren TAM bir CSP basiyor ve `UseStaticFiles`
# (satir 546) ONDAN SONRA geldigi icin yuklenen gorseller de kapsamda. nginx'ten ikinci bir
# CSP basligi eklemek her yanitta iki politika dogurur, kazanc SIFIR olurdu. Storefront ise
# STATIK dosyadir - hicbir middleware kosmaz, tek kaynak burasidir.
#
# KURULUM: bu dosya nginx.conf ile AYNI dizine kurulur (varsayilan: /etc/nginx/).
# Eksikse nginx `nginx -t` ve reload sirasinda GURULTULU duser - sessiz bir bosluk olusmaz.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
