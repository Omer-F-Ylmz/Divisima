# DALGA C / C1 - docker-compose'daki `frontend` servisinin nginx yapilandirmasi.
#
# Bu dosya YEREL/COMPOSE icindir. Uretimdeki karsiligi ops/infra/nginx.conf'taki
# `server_name divisima.com` blogudur; ikisi AYNI davranisi tasir (SPA fallback,
# kod tasiyan dosyalarda no-cache, admin.html noindex, /sitemap.xml proxy'si,
# ic dokuman/gizli dosya/yedek artigi 404'leri).
# TLS ve HSTS burada YOK - compose duz HTTP :5173 kullanir, tarayici localhost'u
# zaten guvenilir origin sayar (Sprint 8 madde 6'da olculdu).
#
# GUVENLIK-FIX-3 - IKI BILINCLI AYRISMA (ikisi de yukaridaki TLS/HSTS gerekcesiyle ayni
# sinifta: yerel duz-HTTP bir gelistirme sunucusu farkli bir tehdit modelidir):
#   1) /test/ BURADA ACIK KALIR. frontend/test/mobil-erisilebilirlik.js, Dalga 4'te
#      belgelenen pin boslugunun (depoda JS/DOM kosucusu yok) telafisidir ve tarayiciya
#      ELLE yuklenerek kosulur; uretimde 404, YERELDE ERISILEBILIR olmalidir.
#   2) Clickjacking basligi (X-Frame-Options / CSP frame-ancestors) BURADA YOK - uretim
#      blogunun `include divisima-security-headers.conf` satirinin karsiligi yoktur.
#      localhost'u iframe'leyen bir saldiri senaryosu yoktur ve include'u buraya tasimak
#      compose'a ikinci bir mount eklemeyi gerektirirdi.
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;

    # ══ GUVENLIK-FIX-3 / #6 - IC DOKUMANLAR VE ARTIKLAR (uretim blogunun aynisi, /test/ haric)
    # .well-known ONCE ve ACIKCA ACIK: RFC 9116 security.txt asagidaki gizli-dosya kuralina
    # TAKILIRDI. `^~` regex'lerin tamamini yener.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    location ~ /\. {
        return 404;
    }

    location ~* \.(md|bak|old|orig|save|tmp|swp|swo|sql|log|sh|ps1|yml|yaml|cs|csproj|sln)$ {
        return 404;
    }

    # Ad bazli: vendor/README.txt uzantiyla yakalanamaz (.txt ACIK KALMALI - robots.txt ve
    # security.txt oradan servis edilir).
    location ~* (^|/)(README|CHANGELOG)[^/]*$ {
        return 404;
    }

    location ~ ~$ {
        return 404;
    }

    # Sitemap: uretimdeki blogun aynisi. Compose aginda API servisinin adi "api".
    # baseUrl VITRIN kokune gore verilir - uretilen <loc> degerleri API'ye degil
    # kullanicinin acacagi adrese isaret etmeli.
    location = /sitemap.xml {
        proxy_pass http://api:5000/api/seo/sitemap?baseUrl=http://localhost:5173;
        proxy_set_header Host $host;
        default_type application/xml;
    }

    # `add_header X-Content-Type-Options` ASAGIDA TEKRARLANIYOR - GEREKLI: nginx'te
    # `add_header` bir onceki seviyeden YALNIZCA o seviyede HIC `add_header` YOKSA devralinir.
    # Bu iki location kendi basligini tanimladigi icin sunucu seviyesindeki nosniff onlara
    # ULASMIYORDU (yani index.html ve tum JS nosniff'siz servis ediliyordu).
    location = /admin.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Kod tasiyan dosyalar onbelleklenmez - service worker network-first (SUPHELI #7)
    # ve surum bump'i unutuldugunda bile duzeltme ulasmali.
    location ~* \.(html|js|json)$ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
