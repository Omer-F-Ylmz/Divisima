# Açıklayıcı yorum: Divisima reverse proxy - TLS 1.3 zorunlu, güvenlik başlıkları, rate limit, WAF öncesi katman.
# API arkada Kestrel'de; nginx TLS sonlandırma + kaba filtreleme yapar.

# Rate limit zone (WAF öncesi kaba koruma)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 443 ssl http2;
    server_name api.divisima.com;

    # ── TLS 1.3 (ve geriye dönük 1.2), zayıf şifreler kapalı ──
    ssl_certificate     /etc/ssl/divisima/fullchain.pem;
    ssl_certificate_key /etc/ssl/divisima/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # Açıklayıcı yorum: OCSP stapling (sertifika iptali kontrolü)
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── HSTS (preload) - tarayıcıya "hep HTTPS" ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Güvenlik başlıkları (uygulama da ekliyor - burada da defense-in-depth) ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── İstek boyutu (dev payload DoS) ──
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ── Rate + connection limit ──
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 20;

    # Sunucu sürümünü gizle
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (SignalR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Hangfire dashboard - yalnız iç ağ (production'da dışa kapalı)
    location /hangfire {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:5000;
    }
}

# ══════════════════════════════════════════════════════════════════════════════════════════
# DALGA C / C1 - STOREFRONT (divisima.com). BU BLOK YOKTU.
#
# OLCULEN ONCE-DURUM: Dockerfile yalniz Divisima.API'yi publish ediyor, docker-compose'da
# frontend servisi yok, bu dosyada TEK server block vardi (api.divisima.com) ve
# Divisima.API/wwwroot yalnizca uploads/products iceriyor. Yani frontend'i KIMIN sunacagi
# depoda HICBIR YERDE tanimli degildi - yayin adimi "dosyalari bir yere kopyala" olarak
# yazisiz kaliyordu.
#
# IKI ORIGIN KORUNDU (kullanici karari) - depo ZATEN bunu varsayiyor ve UC yerde belgeliyor:
#   AllowedOrigins: ["https://divisima.com", ...]
#   Storefront:BaseUrl = https://divisima.com
#   Cookies:Domain = .divisima.com  (Sprint 8 madde 6: "storefront ile API FARKLI HOSTLAR")
# API'nin wwwroot'undan sunmak bu ucunu birden geri almak olurdu.
#
# DAGITIM SIRASI ONEMLI: bu blogun sundugu dosyalara KOPYALAMADAN ONCE
# `ops/set-api-origin.sh https://api.divisima.com` kosulmalidir - aksi halde storefront
# localhost'a bakar ve katalog BOS gelir (DALGA-4-FIX-2 / M1'de olculdu).
server {
    listen 443 ssl http2;
    server_name divisima.com www.divisima.com;

    ssl_certificate     /etc/ssl/divisima/fullchain.pem;
    ssl_certificate_key /etc/ssl/divisima/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # ══ GUVENLIK-FIX-3 / #4 - CLICKJACKING ══════════════════════════════════════════════════
    # OLCULEN ONCE-DURUM (GUVENLIK DALGASI 2): api.divisima.com blogunda X-Frame-Options DENY
    # VARDI, bu blokta YOKTU; index.html'in meta CSP'sinde de `frame-ancestors` yoktu - ustelik
    # meta'ya eklemek COZMEZ, cunku `frame-ancestors` bir <meta> CSP'sinde SPEC GEREGI YOK
    # SAYILIR. Yani divisima.com ve ayni kokten servis edilen admin.html herhangi bir sitede
    # iframe'lenebiliyordu (giris/odeme/admin eylemlerinde clickjacking).
    #
    # Basliklar ARTIK TEK DOSYADAN gelir ve KENDI `add_header`ini tanimlayan HER location'da
    # AYRICA include edilir - gerekcesi divisima-security-headers.conf'un basinda.
    include divisima-security-headers.conf;
    server_tokens off;

    root /var/www/divisima;
    index index.html;

    # ══ GUVENLIK-FIX-3 / #6 - IC DOKUMANLAR VE ARTIKLAR SERVIS EDILMEZ ══════════════════════
    # OLCULEN ONCE-DURUM: /API-CONTRACT.md (11213 bayt), /INTEGRATION.md, /SEO-ANALYTICS.md ve
    # /test/mobil-erisilebilirlik.js hepsi 200 donuyordu; gizli dosya (.git/.env) kurali da
    # YOKTU - `location /` try_files ile dogrudan dosya sistemine dusuyordu.
    #
    # KAPSAM OLCULDU (uydurulmadi): frontend/ agacindaki 24 dosyanin tamami tek tek tarandi.
    # Hicbir kod .md dosyasina referans vermiyor (grep: 0) ve /test/ dizinine referans veren
    # kod YOK - o betik olcum sirasinda ELLE yuklenir. Servis edilmesi GEREKEN her dosya
    # (index.html, api-bridge.js, api-client.js, pwa-register.js, service-worker.js,
    # manifest.json, robots.txt, vendor/purify.min.js, icons/*.png) kapsamin DISINDA kalir;
    # davranis `GuvenlikFix3SozlesmeTests` icinde location cozumlemesi SIMULE EDILEREK pinli.

    # .well-known ONCE ve ACIKCA ACIK: RFC 9116 security.txt burada durur ve asagidaki
    # gizli-dosya kuralina TAKILIRDI. `^~` regex'lerin TAMAMINI yener, yani bu istisna
    # kural sirasindan BAGIMSIZ olarak gecerlidir.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # Olcum betikleri. `^~` SART: dosya `.js` ile bittigi icin asagidaki no-cache regex'ine
    # takilir ve SERVIS EDILIRDI; `^~` prefix'i regex'lerden ONCE karara baglar.
    # NOT: bu kural YEREL/COMPOSE tarafinda (frontend-dev.conf) BILEREK YOKTUR - o betik
    # Dalga 4'un pin boslugunu telafi eden olcum aracidir ve yerelde erisilebilir kalmalidir.
    location ^~ /test/ {
        return 404;
    }

    # Gizli dosyalar: .git, .env, .htpasswd, editor artiklari. (.well-known yukarida muaf.)
    location ~ /\. {
        return 404;
    }

    # Ic dokumanlar, veritabani/log dokumleri, betikler ve yedek artiklari.
    location ~* \.(md|bak|old|orig|save|tmp|swp|swo|sql|log|sh|ps1|yml|yaml|cs|csproj|sln)$ {
        return 404;
    }

    # Ad bazli: vendor/README.txt gibi dosyalar uzantiyla yakalanamaz (.txt ACIK KALMALI -
    # robots.txt ve security.txt oradan servis edilir).
    location ~* (^|/)(README|CHANGELOG)[^/]*$ {
        return 404;
    }

    # Editor yedegi (dosya~).
    location ~ ~$ {
        return 404;
    }

    # SITEMAP - C5'IN KOPUK HALKASI BURADA KAPANIYOR.
    # frontend/robots.txt "Sitemap: https://divisima.com/sitemap.xml" diyor; sitemap'i URETEN
    # uc (GET /api/seo/sitemap) API'de VAR ama o adresi SUNAN hicbir sey YOKTU - yani robots
    # arama motorunu OLU bir adrese gonderiyordu. baseUrl BURADA veriliyor cunku uretilen
    # <loc> degerleri VITRIN kokune gore olmali, API'ninkine gore degil.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/api/seo/sitemap?baseUrl=https://divisima.com;
        proxy_set_header Host $host;
        default_type application/xml;
    }

    # ADMIN PANELI ARAMA MOTORUNA KAPALI (robots.txt de Disallow ediyor; bu ikinci katman -
    # robots bir SOZLESMEDIR, zorlayici degil).
    # `include` ZORUNLU: bu location kendi `add_header`ini tanimladigi icin sunucu
    # seviyesindeki guvenlik basliklarini DEVRALMAZ.
    location = /admin.html {
        include divisima-security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Kod tasiyan dosyalar ONBELLEKLENMEZ: service worker zaten network-first (SUPHELI #7) ve
    # surum bump'i unutuldugunda bile duzeltmenin ulasmasi gerekir.
    # `include` ZORUNLU: ayni devralma kurali - bu regex index.html'i de kapsar, yani guvenlik
    # basliklarinin ULASMASI GEREKEN ASIL SAYFA burasidir.
    location ~* \.(html|js|json)$ {
        include divisima-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        # Hash router: bilinmeyen YOL yok, her sey index.html uzerinden calisir.
        try_files $uri $uri/ /index.html;
    }
}

# HTTP -> HTTPS yönlendirme
server {
    listen 80;
    server_name api.divisima.com divisima.com www.divisima.com;
    return 301 https://$host$request_uri;
}
