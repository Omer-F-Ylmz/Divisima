# Açıklayıcı yorum: Divisima reverse proxy - TLS 1.3 zorunlu, güvenlik başlıkları, rate limit, WAF öncesi katman.
# API arkada Kestrel'de; nginx TLS sonlandırma + kaba filtreleme yapar.

# Rate limit zone (WAF öncesi kaba koruma)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 443 ssl http2;
    server_name api.divisima.com;

    # ── TLS 1.3 (ve geriye dönük 1.2), zayıf şifreler kapalı ──
    ssl_certificate     /etc/ssl/divisima/fullchain.pem;
    ssl_certificate_key /etc/ssl/divisima/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # Açıklayıcı yorum: OCSP stapling (sertifika iptali kontrolü)
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── HSTS (preload) - tarayıcıya "hep HTTPS" ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Güvenlik başlıkları (uygulama da ekliyor - burada da defense-in-depth) ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── İstek boyutu (dev payload DoS) ──
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ── Rate + connection limit ──
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 20;

    # Sunucu sürümünü gizle
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (SignalR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Hangfire dashboard - yalnız iç ağ (production'da dışa kapalı)
    location /hangfire {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:5000;
    }
}

# ══════════════════════════════════════════════════════════════════════════════════════════
# DALGA C / C1 - STOREFRONT (divisima.com). BU BLOK YOKTU.
#
# OLCULEN ONCE-DURUM: Dockerfile yalniz Divisima.API'yi publish ediyor, docker-compose'da
# frontend servisi yok, bu dosyada TEK server block vardi (api.divisima.com) ve
# Divisima.API/wwwroot yalnizca uploads/products iceriyor. Yani frontend'i KIMIN sunacagi
# depoda HICBIR YERDE tanimli degildi - yayin adimi "dosyalari bir yere kopyala" olarak
# yazisiz kaliyordu.
#
# IKI ORIGIN KORUNDU (kullanici karari) - depo ZATEN bunu varsayiyor ve UC yerde belgeliyor:
#   AllowedOrigins: ["https://divisima.com", ...]
#   Storefront:BaseUrl = https://divisima.com
#   Cookies:Domain = .divisima.com  (Sprint 8 madde 6: "storefront ile API FARKLI HOSTLAR")
# API'nin wwwroot'undan sunmak bu ucunu birden geri almak olurdu.
#
# DAGITIM SIRASI ONEMLI: bu blogun sundugu dosyalara KOPYALAMADAN ONCE
# `ops/set-api-origin.sh https://api.divisima.com` kosulmalidir - aksi halde storefront
# localhost'a bakar ve katalog BOS gelir (DALGA-4-FIX-2 / M1'de olculdu).
server {
    listen 443 ssl http2;
    server_name divisima.com www.divisima.com;

    ssl_certificate     /etc/ssl/divisima/fullchain.pem;
    ssl_certificate_key /etc/ssl/divisima/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    root /var/www/divisima;
    index index.html;

    # SITEMAP - C5'IN KOPUK HALKASI BURADA KAPANIYOR.
    # frontend/robots.txt "Sitemap: https://divisima.com/sitemap.xml" diyor; sitemap'i URETEN
    # uc (GET /api/seo/sitemap) API'de VAR ama o adresi SUNAN hicbir sey YOKTU - yani robots
    # arama motorunu OLU bir adrese gonderiyordu. baseUrl BURADA veriliyor cunku uretilen
    # <loc> degerleri VITRIN kokune gore olmali, API'ninkine gore degil.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5000/api/seo/sitemap?baseUrl=https://divisima.com;
        proxy_set_header Host $host;
        default_type application/xml;
    }

    # ADMIN PANELI ARAMA MOTORUNA KAPALI (robots.txt de Disallow ediyor; bu ikinci katman -
    # robots bir SOZLESMEDIR, zorlayici degil).
    location = /admin.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Kod tasiyan dosyalar ONBELLEKLENMEZ: service worker zaten network-first (SUPHELI #7) ve
    # surum bump'i unutuldugunda bile duzeltmenin ulasmasi gerekir.
    location ~* \.(html|js|json)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        # Hash router: bilinmeyen YOL yok, her sey index.html uzerinden calisir.
        try_files $uri $uri/ /index.html;
    }
}

# HTTP -> HTTPS yönlendirme
server {
    listen 80;
    server_name api.divisima.com divisima.com www.divisima.com;
    return 301 https://$host$request_uri;
}
