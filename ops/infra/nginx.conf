# Açıklayıcı yorum: Divisima reverse proxy - TLS 1.3 zorunlu, güvenlik başlıkları, rate limit, WAF öncesi katman.
# API arkada Kestrel'de; nginx TLS sonlandırma + kaba filtreleme yapar.

# Rate limit zone (WAF öncesi kaba koruma)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
    listen 443 ssl http2;
    server_name api.divisima.com;

    # ── TLS 1.3 (ve geriye dönük 1.2), zayıf şifreler kapalı ──
    ssl_certificate     /etc/ssl/divisima/fullchain.pem;
    ssl_certificate_key /etc/ssl/divisima/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    # Açıklayıcı yorum: OCSP stapling (sertifika iptali kontrolü)
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── HSTS (preload) - tarayıcıya "hep HTTPS" ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Güvenlik başlıkları (uygulama da ekliyor - burada da defense-in-depth) ──
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── İstek boyutu (dev payload DoS) ──
    client_max_body_size 2m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # ── Rate + connection limit ──
    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 20;

    # Sunucu sürümünü gizle
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket (SignalR)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Hangfire dashboard - yalnız iç ağ (production'da dışa kapalı)
    location /hangfire {
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://127.0.0.1:5000;
    }
}

# HTTP -> HTTPS yönlendirme
server {
    listen 80;
    server_name api.divisima.com;
    return 301 https://$host$request_uri;
}
