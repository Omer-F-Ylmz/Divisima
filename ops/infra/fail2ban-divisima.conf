# Divisima fail2ban yapılandırması → /etc/fail2ban/jail.d/divisima.conf
# Açıklayıcı yorum: nginx loglarından saldırı desenlerini tespit edip IP'yi geçici banlar (iptables).

[divisima-auth]
enabled  = true
port     = http,https
filter   = divisima-auth
logpath  = /var/log/nginx/access.log
maxretry = 5           # 5 başarısız giriş
findtime = 300         # 5 dakikada
bantime  = 3600        # 1 saat ban

[divisima-429]
enabled  = true
port     = http,https
filter   = divisima-429
logpath  = /var/log/nginx/access.log
maxretry = 20          # 20 rate-limit (429) yanıtı
findtime = 60
bantime  = 1800        # 30 dk ban

[nginx-badbots]
enabled  = true
port     = http,https
filter   = apache-badbots
logpath  = /var/log/nginx/access.log
maxretry = 2
bantime  = 86400       # 1 gün

# Filter: /etc/fail2ban/filter.d/divisima-auth.conf içeriği:
#   [Definition]
#   failregex = ^<HOST>.*"POST /api/auth/login.*" 401
#   ignoreregex =
# Filter: /etc/fail2ban/filter.d/divisima-429.conf:
#   [Definition]
#   failregex = ^<HOST>.*" 429 
#   ignoreregex =
