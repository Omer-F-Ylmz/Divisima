# Divisima DDoS Koruma (nginx) - nginx.conf'a dahil edilir veya http{} bloğuna eklenir
# Açıklayıcı yorum: L7 DDoS + slowloris + connection flood savunması. Cloudflare/WAF önünde son katman.

# ── Rate limit zone'ları (bellek: 10m ≈ 160k IP) ──
limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;   # genel
limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;        # giriş (brute-force)
limit_req_zone $binary_remote_addr zone=payment:10m rate=2r/s;     # ödeme
limit_conn_zone $binary_remote_addr zone=perip:10m;                # IP başı bağlantı
limit_conn_zone $server_name zone=perserver:10m;                   # sunucu toplam

server {
    # ── Slowloris savunması (yavaş istek DoS) ──
    client_body_timeout 10s;       # gövde 10 sn içinde gelmeli
    client_header_timeout 10s;     # başlık 10 sn içinde
    send_timeout 10s;
    keepalive_timeout 15s;
    client_max_body_size 6m;       # görsel yükleme üst sınırı
    large_client_header_buffers 4 8k;

    # ── Bağlantı limitleri ──
    limit_conn perip 20;           # IP başına 20 eşzamanlı
    limit_conn perserver 2000;     # sunucu toplam
    limit_req_status 429;
    limit_conn_status 429;

    # ── Yol bazlı rate limit (burst + nodelay) ──
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }
    location /api/payment/ {
        limit_req zone=payment burst=5 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://127.0.0.1:5000;
    }

    # ── Bilinen kötü user-agent / boş UA engeli ──
    if ($http_user_agent ~* (nikto|sqlmap|nmap|masscan|zgrab)) { return 403; }
    if ($http_user_agent = "") { return 403; }
}

# NOT: Gerçek hacimsel (L3/L4) DDoS için Cloudflare/AWS Shield şart - nginx yalnız L7.
